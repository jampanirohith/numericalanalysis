[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "numericalanalysisiiser"
version = "0.1.0"
description = "Numerical analysis methods (interpolation, differentiation, integration, root finding, linear systems, ODEs) that return pandas DataFrames"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jampanirohith" }]
keywords = [
    "numerical analysis", "interpolation", "numerical integration", "numerical differentiation",
    "root finding", "iterative methods", "ode", "pandas",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy", "pandas"]

[project.urls]
Homepage = "https://github.com/jampanirohith/numericalanalysis"
Issues = "https://github.com/jampanirohith/numericalanalysis/issues"

[tool.setuptools.packages.find]
include = ["numericalanalysisiiser*"]
